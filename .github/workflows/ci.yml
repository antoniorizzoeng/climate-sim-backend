name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/checkout@v6
        with:
          repository: antoniorizzoeng/climate-sim-mpi-cpp
          ref: main
          path: engine
          persist-credentials: false
      - name: Build the MPI engine
        run: |
          APT="sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $APT update
          $APT install -y --no-install-recommends openmpi-bin libopenmpi-dev libyaml-cpp-dev libnetcdf-dev libpnetcdf-dev
          # Static ffmpeg from the imageio-ffmpeg wheel (apt's ffmpeg pulls a huge dependency tree).
          python -m pip install imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build engine/build --target climate_sim --parallel 2
          test -x engine/build/src/climate_sim
      - run: python -m pip install -r requirements-dev.txt
      - name: Check style
        run: |
          black --check app tests
          isort --check-only app tests
          flake8 app tests
      - name: Run tests including real MPI and ffmpeg
        env:
          ENGINE_BIN: ${{ github.workspace }}/engine/build/src/climate_sim
          MPIRUN_ARGS: --oversubscribe
        run: pytest -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
      - name: Build API image and exercise the packaged launcher
        run: |
          docker compose build
          docker compose run --rm --no-deps api mpirun --oversubscribe -np 2 climate_sim \
            --nx=8 --ny=8 --steps=3 --output=/tmp/smoke.nc --progress=/tmp/progress.json
