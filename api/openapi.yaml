openapi: 3.1.0
info:
  title: climate-sim API
  version: 1.4.0
  description: |
    Backend for the climate-sim frontend. Runs the MPI engine (climate-sim-mpi-cpp) locally with mpirun.
    Single local user, no authentication. One run executes at a time (all cores); others wait in a FIFO queue.

    ## Conventions
    - Ids are opaque strings (UUID4 hex). One id per run, used for the route, the directory and the process.
    - Grids are row-major [ny, nx]; index (j, i) = (y, x); j = 0 is the BOTTOM row (the engine's y = 0).
      PNGs are drawn with j = 0 at the bottom of the image. Drawing, hover, PNG and video all use this orientation.
    - Raw value endpoints return little-endian float32, row-major (j = 0 first), with headers X-Nx and X-Ny
      (and X-I0, X-J0, X-Stride for windows). NaN marks missing cells. CORS exposes these headers.
    - Errors: 422 → ValidationError {detail: [{loc, msg, type}]}; every other 4xx/5xx → MessageError {detail: string}.
    - All request objects reject unknown properties.

    ## Stability (explicit upwind advection + FTCS diffusion share one timestep)
    dt_max = 1 / (|vx|/dx + |vy|/dy + 2·D·(1/dx² + 1/dy²)); null when the denominator is 0 (any dt is stable).
    For nz > 1, dt_max = 1 / (|vx|/dx + |vy|/dy + |vz|/dz + 2·(D/dx² + D/dy² + Dz/dz²)).
    Dz defaults to D. A zero denominator again yields null. For nz = 1 the z terms are ignored.
    POST /runs returns 422 when dt > dt_max. The frontend computes the same formula live and clamps.

    ## Boundary conditions
    UI labels: dirichlet = "fixed (value 0 outside)", neumann = "insulated (zero gradient)", periodic = "wrap-around".
    periodic must be set on both opposite edges of an axis. The backend only offers what the installed engine
    supports (ServerConfig.supported_boundary_conditions). A startup probe verifies periodic wrap-around.

    ## Volume playback
    For nz > 1 the output variable is u(time, z, y, x). A z view returns rows and columns (y, x),
    a y view (z, x), and an x view (z, y). Row zero is first in raw data and at the bottom of an image.
    Windows and X-Nx/X-Ny refer to the displayed columns and rows. Slices and projections share the run colour range.
    For nz = 1, axis, slice and projection are accepted and ignored.

    ## Timeline
    out_every is either given or derived from `frames` (K ≥ 2): out_every = ceil(steps / (K − 1)).
    expected_frames = 1 + ceil(steps / out_every). Frame k (0-based) is the state at step min(k·out_every, steps),
    time = step·dt. The last frame is always the final state.

    ## NetCDF ingestion
    Accepted: classic, 64-bit offset, CDF-5 and NetCDF-4 (HDF5) files. Only numeric variables with ≥ 2 dimensions
    are listed. The last two dimensions are (y, x); every other dimension is an "extra" dimension that needs an index
    (default 0). If a 1-D coordinate variable for y or x is descending, that axis is reversed so j/i increase with the
    coordinate. The effective fill value (including the NetCDF default when filling is enabled) and missing_value
    are masked in stored units. Then scale_factor and add_offset are applied once. Simulation uses float64.
    Non-finite or masked cells are "missing".
    The selected plane is written as a 2-D CDF-5 double variable "u" in the run directory and passed as ic.var=u.

    With FieldSource.volume enabled, a vertical dimension immediately before (y, x) supplies all z layers.
    It is recognized by its case-insensitive name (z, nz, depth, height, altitude, level, lev, layer, plev, pressure,
    isobaricInhPa, isobaricInPa) or its coordinate metadata (axis Z, positive up/down, or standard_name
    depth, height, altitude, air_pressure). Other extra dimensions retain their selected indices. The whole-volume
    selection ignores the z index and reverses descending z coordinates. Missing-cell rules apply across all layers.

    ## Retention (product decision)
    - A field is ACTIVE for 7 days after its last use (creation or a run started from it), then ARCHIVED for 30 days:
      still listed, original file downloadable, usable for new runs or reruns (which make it active again), but no
      preview/values. Then it is deleted. Fields used by queued or running jobs stay active with their wind files.
    - A run's outputs (frames, result.nc, exports) are deleted 7 days after it finishes; the run becomes EXPIRED and
      keeps only its request so it can be rerun while its field exists (preset runs can always be rerun until the record
      itself is deleted 37 days after finishing).
    - expires_at / deleted_at timestamps are returned so the UI can show them. Cleanup runs at startup and hourly.

    ## Units (1.4.0)
    The engine is unitless; units live in the API. RunRequest.units = {length, time} names the unit system of the
    request: dx/dy/dz are lengths per cell, vx/vy/vz are length/time, D/Dz are length²/time, dt and Run.time are time.
    Omitted units mean {length: cell, time: t} (grid units, the 1.3 behaviour). Values are passed to the engine as given
    (no conversion is needed because every quantity uses the same system). The unit system is stored with the run,
    echoed in Run.request.units, and written into result.nc and NetCDF exports as CF `units` attributes
    (time: "h"/"s"/"1"; x/y/z coordinates: "km"/"m"/"1"; u: the source variable's units when known, else "1").
    Variable.spacing reports grid spacing derived from 1-D x/y/z coordinate variables and their CF units so clients can
    prefill dx/dy/dz (converted to the chosen length unit). Degrees are converted with the mean latitude of the plane
    (equirectangular approximation) and flagged approximate.

    ## Process count (1.4.0)
    Clients should omit RunRequest.processes. The backend then picks the rank count itself from the grid size and
    cpu_count (never more ranks than useful for the grid) and reports it in ResolvedRun.processes.

    ## Persistence and queue
    One manager owns DATA_DIR. A run's request is persisted before 202 is returned. On restart, queued runs are
    resumed; a run that was running is marked error ("interrupted by restart"). DELETE of a queued/running run stops
    mpirun (all ranks) before deleting files.

servers:
  - url: http://localhost:8000

paths:
  /health:
    get:
      operationId: health
      summary: Returns 503 when the run worker has stopped or is retrying a metadata write.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, engine, api_version]
                properties:
                  status: { type: string, enum: [ok] }
                  engine: { type: string, description: Engine binary path and version }
                  api_version: { type: string, description: "info.version of this contract, e.g. 1.4.0" }
        "503": { $ref: "#/components/responses/MessageError" }

  /storage:
    get:
      operationId: getStorage
      summary: Disk used by stored data and free space on the data volume (single local user; per-user quotas come later).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUsage" }

  /config:
    get:
      operationId: getServerConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerConfig" }

  /fields:
    post:
      operationId: uploadField
      summary: Upload a NetCDF file. The original is kept for download; selected planes are normalised per run.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listFields
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/CreatedFrom" }
        - { $ref: "#/components/parameters/CreatedTo" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: Filtered and sorted (default created_desc)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total, total_bytes]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Field" } }
                  next_cursor: { type: [string, "null"] }
                  total: { type: integer, description: Number of matching items across all pages }
                  total_bytes: { type: integer, description: Sum of size_bytes of matching items }
        "422": { $ref: "#/components/responses/ValidationError" }

  /fields/drawn:
    post:
      operationId: createDrawnField
      summary: Store a field drawn in the browser (single variable "u", no extra dimensions).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nx, ny, data]
              properties:
                nx: { type: integer, minimum: 4 }
                ny: { type: integer, minimum: 4 }
                name: { type: string, default: drawn }
                data:
                  type: string
                  format: binary
                  description: Little-endian float32, row-major [ny, nx], j = 0 first; exactly 4·nx·ny bytes; all finite.
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /fields/{fieldId}:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      operationId: getField
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
        "404": { $ref: "#/components/responses/MessageError" }
    patch:
      operationId: renameField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed (the original filename is still used for downloads)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
        "404": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteField
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/MessageError" }
        "409":
          description: A queued or running run depends on this field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  /fields/{fieldId}/original:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      operationId: downloadFieldOriginal
      summary: The uploaded file as received (drawn fields are served as CDF-5). Available while active or archived.
      responses:
        "200":
          description: File download
          content: { application/x-netcdf: {} }
        "404": { $ref: "#/components/responses/MessageError" }

  /fields/{fieldId}/preview.png:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      operationId: getFieldPreview
      parameters:
        - { $ref: "#/components/parameters/Var" }
        - { $ref: "#/components/parameters/Index" }
        - { $ref: "#/components/parameters/Colormap" }
        - { $ref: "#/components/parameters/Vmin" }
        - { $ref: "#/components/parameters/Vmax" }
        - { $ref: "#/components/parameters/MaxSide" }
      responses:
        "200":
          description: Missing cells are transparent. Default range is the plane's finite min/max.
          content: { image/png: {} }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "413": { $ref: "#/components/responses/PngMemoryLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /fields/{fieldId}/stats:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      operationId: getFieldPlaneStats
      summary: Statistics of one plane (variable + extra-dimension indices).
      parameters:
        - { $ref: "#/components/parameters/Var" }
        - { $ref: "#/components/parameters/Index" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaneStats" }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /fields/{fieldId}/values:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      operationId: getFieldValues
      summary: Raw float32 values of one plane or a window of it (hover readout, loading an upload into the canvas).
      parameters:
        - { $ref: "#/components/parameters/Var" }
        - { $ref: "#/components/parameters/Index" }
        - { $ref: "#/components/parameters/I0" }
        - { $ref: "#/components/parameters/J0" }
        - { $ref: "#/components/parameters/W" }
        - { $ref: "#/components/parameters/H" }
        - { $ref: "#/components/parameters/Stride" }
      responses:
        "200": { $ref: "#/components/responses/Float32Grid" }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs:
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted (queued, or running if the queue was empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listRuns
      summary: User runs only. The layer runs owned by a nowcast are excluded (their bytes count in /storage under nowcasts).
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/CreatedFrom" }
        - { $ref: "#/components/parameters/CreatedTo" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: Filtered and sorted (default created_desc)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total, total_bytes]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  next_cursor: { type: [string, "null"] }
                  total: { type: integer, description: Number of matching items across all pages }
                  total_bytes: { type: integer, description: Sum of size_bytes of matching items }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/validate:
    post:
      operationId: validateRun
      summary: Same checks as POST /runs without starting anything, plus resolved values and cost estimates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "200":
          description: Validation result for a well-formed body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunValidation" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      operationId: getRun
      summary: Status and progress. Poll ~2/s while running, ~every 2 s while queued; stop at done/error/expired.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/MessageError" }
    patch:
      operationId: renameRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteRun
      summary: Stops mpirun if queued/running (returns after all ranks exited), then deletes the run and its files.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/MessageError" }

  /runs/{runId}/rerun:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      operationId: rerun
      summary: Start a new run with the same request (works for expired runs while the field exists).
      responses:
        "202":
          description: New run accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}/frames/{n}.png:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/FrameIndex" }
    get:
      operationId: getFramePng
      parameters:
        - { $ref: "#/components/parameters/Axis" }
        - { $ref: "#/components/parameters/Slice" }
        - { $ref: "#/components/parameters/Projection" }
        - { $ref: "#/components/parameters/Colormap" }
        - { $ref: "#/components/parameters/Vmin" }
        - { $ref: "#/components/parameters/Vmax" }
        - { $ref: "#/components/parameters/MaxSide" }
      responses:
        "200":
          description: Default colour range is Run.display_range. Immutable (Cache-Control) once written.
          content: { image/png: {} }
        "404": { description: "n ≥ expected_frames, unknown run, or outputs expired", content: { application/json: { schema: { $ref: "#/components/schemas/MessageError" } } } }
        "409": { description: Frame not written yet, content: { application/json: { schema: { $ref: "#/components/schemas/MessageError" } } } }
        "413": { $ref: "#/components/responses/PngMemoryLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}/frames/{n}/values:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/FrameIndex" }
    get:
      operationId: getFrameValues
      parameters:
        - { $ref: "#/components/parameters/Axis" }
        - { $ref: "#/components/parameters/Slice" }
        - { $ref: "#/components/parameters/Projection" }
        - { $ref: "#/components/parameters/I0" }
        - { $ref: "#/components/parameters/J0" }
        - { $ref: "#/components/parameters/W" }
        - { $ref: "#/components/parameters/H" }
        - { $ref: "#/components/parameters/Stride" }
      responses:
        "200": { $ref: "#/components/responses/Float32Grid" }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}/frames/{n}/volume:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/FrameIndex" }
    get:
      operationId: getFrameVolume
      summary: Sample one frame for client-side 3D rendering.
      parameters:
        - name: max_side
          in: query
          schema: { type: integer, minimum: 1, maximum: 128, default: 64 }
      responses:
        "200":
          description: >
            Little-endian float32 in row-major [z, y, x] order, x fastest. All axes start at zero and use
            stride ceil(max(nx, ny, nz) / max_side). The headers give the sampled dimensions.
            A single-layer run has X-Nz = 1.
          headers:
            X-Nx: { schema: { type: integer } }
            X-Ny: { schema: { type: integer } }
            X-Nz: { schema: { type: integer } }
          content: { application/octet-stream: {} }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}/export.{format}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - name: format
        in: path
        required: true
        schema: { type: string, enum: [mp4, gif] }
    get:
      operationId: exportRun
      summary: >
        Animation of all frames, rendered frame by frame into ffmpeg in a background worker (identical requests are
        coalesced and cached). Returns 202 with Retry-After until ready, then 200 with the file. Only when status is done.
      parameters:
        - { $ref: "#/components/parameters/Axis" }
        - { $ref: "#/components/parameters/Slice" }
        - { $ref: "#/components/parameters/Projection" }
        - name: fps
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
        - { $ref: "#/components/parameters/Colormap" }
        - { $ref: "#/components/parameters/Vmin" }
        - { $ref: "#/components/parameters/Vmax" }
        - { $ref: "#/components/parameters/MaxSide" }
      responses:
        "200":
          description: File download (Content-Disposition attachment)
          content:
            video/mp4: {}
            image/gif: {}
        "202":
          description: Being generated
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [progress]
                properties:
                  progress: { type: number, minimum: 0, maximum: 1 }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}/result.nc:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      operationId: downloadResult
      summary: Raw engine output (CDF-5, u(time, y, x) or u(time, z, y, x)). Only when status is done.
      responses:
        "200":
          description: File download
          content: { application/x-netcdf: {} }
        "404": { $ref: "#/components/responses/MessageError" }
        "409": { $ref: "#/components/responses/MessageError" }

  /nowcasts:
    post:
      operationId: createNowcast
      summary: Advect cloud cover around an observing site for the next 1–12 hours.
      description: |
        Uses hourly Open-Meteo low, mid and high cloud cover and winds at 850, 500 and 300 hPa.
        Three FIFO runs transport the initial cloud layers on a local grid with zero-gradient edges.
        Transport omits cloud formation, dissipation and vertical motion. It is most useful for a few hours,
        especially before air from outside the domain reaches the site. The blend starts with transport and gives
        increasing weight to the Open-Meteo forecast as lead time grows. The transport weight is exp(−t/τ), where t
        is hours from data_time and τ is blend_tau_hours. At t = τ, transport contributes about 37%.
        Grid footprints must stay short of the poles.
        Coordinates of the site and surrounding grid are sent to Open-Meteo. A failed wind-file probe or
        unavailable forecast yields an error record with a diagnostic. Attribute model data to Open-Meteo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NowcastParams" }
      responses:
        "202": { $ref: "#/components/responses/NowcastRecord" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listNowcasts
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Most recent first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Nowcast" } }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/ValidationError" }

  /nowcasts/{id}:
    parameters: [{ $ref: "#/components/parameters/NowcastId" }]
    get:
      operationId: getNowcast
      responses:
        "200": { $ref: "#/components/responses/NowcastRecord" }
        "404": { $ref: "#/components/responses/MessageError" }
    delete:
      operationId: deleteNowcast
      summary: Stop and delete the nowcast and its three layer runs.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/MessageError" }

  /nowcasts/{id}/refresh:
    parameters: [{ $ref: "#/components/parameters/NowcastId" }]
    post:
      operationId: refreshNowcast
      summary: Create a separate nowcast with the same parameters, bypassing the local hourly cache.
      responses:
        "202": { $ref: "#/components/responses/NowcastRecord" }
        "404": { $ref: "#/components/responses/MessageError" }

components:
  parameters:
    NowcastId: { name: id, in: path, required: true, schema: { type: string } }
    FieldId: { name: fieldId, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    Axis: { name: axis, in: query, description: Axis perpendicular to the view, schema: { type: string, enum: [z, y, x], default: z } }
    Slice: { name: slice, in: query, description: "Zero-based layer along axis, default floor(axis length / 2). Ignored for projections.", schema: { type: integer, minimum: 0 } }
    Projection: { name: projection, in: query, description: Reduce along the selected axis, schema: { type: string, enum: [none, max, mean], default: none } }
    FrameIndex: { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
    Var:
      name: var
      in: query
      description: Variable name; defaults to Field.default_var.
      schema: { type: string }
    Index:
      name: index
      in: query
      style: deepObject
      explode: true
      description: "Extra-dimension indices, e.g. index[time]=3&index[depth]=0; missing ones default to 0."
      schema:
        type: object
        additionalProperties: { type: integer, minimum: 0 }
    Colormap: { name: colormap, in: query, schema: { $ref: "#/components/schemas/Colormap" } }
    Vmin: { name: vmin, in: query, description: "Must be given with vmax; finite and vmin < vmax", schema: { type: number } }
    Vmax: { name: vmax, in: query, schema: { type: number } }
    MaxSide:
      name: max_side
      in: query
      description: Downscale (area average) so the long side is at most this many pixels. Omit for native resolution (one pixel per cell).
      schema: { type: integer, minimum: 16 }
    I0: { name: i0, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    J0: { name: j0, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    W: { name: w, in: query, description: Window width in cells (default to the edge), schema: { type: integer, minimum: 1 } }
    H: { name: h, in: query, description: Window height in cells (default to the edge), schema: { type: integer, minimum: 1 } }
    Stride: { name: stride, in: query, description: Take every stride-th cell in both axes, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Q: { name: q, in: query, description: "Case-insensitive substring match on name (and id prefix)", schema: { type: string, maxLength: 120 } }
    CreatedFrom: { name: created_from, in: query, description: Inclusive lower bound on created_at, schema: { type: string, format: date-time } }
    CreatedTo: { name: created_to, in: query, description: Exclusive upper bound on created_at, schema: { type: string, format: date-time } }
    Sort:
      name: sort
      in: query
      description: Ties break on id. A cursor is only valid with the same q, created_from, created_to and sort (422 otherwise).
      schema: { type: string, enum: [created_desc, created_asc, size_desc, size_asc, name_asc, name_desc], default: created_desc }
    Cursor: { name: cursor, in: query, schema: { type: string } }

  responses:
    NowcastRecord:
      description: Sky nowcast record
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Nowcast" }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    MessageError:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    PngMemoryLimit:
      description: The native plane exceeds the available RAM allowance, or the requested downscale cannot fit the configured rendering budget.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    Float32Grid:
      description: Little-endian float32, row-major [h, w], j = j0 first
      headers:
        X-Nx: { schema: { type: integer }, description: Columns in this response }
        X-Ny: { schema: { type: integer }, description: Rows in this response }
        X-I0: { schema: { type: integer } }
        X-J0: { schema: { type: integer } }
        X-Stride: { schema: { type: integer } }
      content: { application/octet-stream: {} }

  schemas:
    MessageError:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }

    ValidationIssue:
      type: object
      required: [loc, msg, type]
      properties:
        loc: { type: array, items: { type: [string, integer] } }
        msg: { type: string }
        type: { type: string }

    Colormap:
      type: string
      enum: [viridis, inferno, magma, plasma, cividis, turbo, coolwarm, gray]
      default: viridis

    BoundaryCondition:
      type: string
      enum: [dirichlet, neumann, periodic]

    ServerConfig:
      type: object
      additionalProperties: false
      required: [cpu_count, default_processes, colormaps, presets, supported_boundary_conditions, disk_free_bytes, retention]
      properties:
        cpu_count: { type: integer }
        default_processes: { type: integer, description: Ranks used when RunRequest.processes is omitted (all cores) }
        colormaps: { type: array, items: { $ref: "#/components/schemas/Colormap" } }
        presets: { type: array, items: { $ref: "#/components/schemas/Preset" } }
        supported_boundary_conditions: { type: array, items: { $ref: "#/components/schemas/BoundaryCondition" } }
        disk_free_bytes: { type: integer }
        retention:
          type: object
          additionalProperties: false
          required: [active_days, archive_days]
          properties:
            active_days: { type: integer, const: 7 }
            archive_days: { type: integer, const: 30 }

    Preset:
      type: string
      enum: [gaussian_hotspot, constant_zero]

    ExtraDim:
      type: object
      additionalProperties: false
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer }
        values:
          type: [array, "null"]
          items: { type: [number, string] }
          description: Coordinate values (e.g. decoded times as ISO strings) when available, for the index picker labels.

    Variable:
      type: object
      additionalProperties: false
      required: [name, nx, ny, nz, extra_dims]
      properties:
        name: { type: string }
        nx: { type: integer }
        ny: { type: integer }
        nz: { type: integer, description: Size of the vertical dimension or 1 when absent }
        z_dim: { type: string, description: Name of the vertical dimension when present }
        extra_dims: { type: array, items: { $ref: "#/components/schemas/ExtraDim" } }
        units: { type: [string, "null"] }
        long_name: { type: [string, "null"] }
        spacing:
          oneOf: [{ $ref: "#/components/schemas/GridSpacing" }, { type: "null" }]
          description: Spacing derived from 1-D coordinate variables with recognised CF units; null when unknown.

    GridSpacing:
      type: object
      additionalProperties: false
      required: [dx, dy, length_unit, approximate]
      properties:
        dx: { type: number, exclusiveMinimum: 0, description: Mean spacing along x in length_unit }
        dy: { type: number, exclusiveMinimum: 0 }
        dz: { type: [number, "null"], exclusiveMinimum: 0, description: Only for a vertical length coordinate (not pressure) }
        length_unit: { type: string, enum: [m, km] }
        approximate:
          type: boolean
          description: True when converted from degrees or when the coordinate spacing is non-uniform by more than 1%.

    Units:
      type: object
      additionalProperties: false
      required: [length, time]
      properties:
        length: { type: string, enum: [cell, m, km] }
        time: { type: string, enum: [t, s, h] }
      description: Unit system of a run request. cell/t are grid units.

    RenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; must not be blank }

    StorageUsage:
      type: object
      additionalProperties: false
      required: [used_bytes, runs_bytes, fields_bytes, nowcasts_bytes, free_bytes, total_bytes]
      properties:
        used_bytes: { type: integer, description: runs_bytes + fields_bytes + nowcasts_bytes }
        runs_bytes: { type: integer }
        fields_bytes: { type: integer, description: Active and archived fields }
        nowcasts_bytes: { type: integer, description: Nowcast records including their layer runs }
        free_bytes: { type: integer, description: Free space on the data volume }
        total_bytes: { type: integer, description: Size of the data volume }

    PlaneStats:
      type: object
      additionalProperties: false
      required: [var, index, nx, ny, min, max, mean, missing_count]
      properties:
        var: { type: string }
        index: { type: object, additionalProperties: { type: integer } }
        nx: { type: integer }
        ny: { type: integer }
        min: { type: [number, "null"], description: Over finite, non-missing cells; null if all missing }
        max: { type: [number, "null"] }
        mean: { type: [number, "null"], description: Suggested default fill value }
        missing_count: { type: integer }

    Field:
      type: object
      additionalProperties: false
      required: [id, source, name, created_at, state, expires_at, variables, default_var, default_stats, size_bytes]
      properties:
        id: { type: string }
        source: { type: string, enum: [upload, drawn] }
        name: { type: string, description: Display name; initially the original filename or the drawn name; editable with PATCH }
        size_bytes: { type: integer, description: Bytes on disk for this field (original, normalised planes, previews) }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        state: { type: string, enum: [active, archived] }
        expires_at: { type: string, format: date-time, description: When it becomes archived (if active) or is deleted (if archived) }
        variables: { type: array, items: { $ref: "#/components/schemas/Variable" } }
        default_var: { type: string }
        default_stats: { $ref: "#/components/schemas/PlaneStats", description: "Stats of default_var at index 0 (null-safe)" }

    FieldSource:
      type: object
      additionalProperties: false
      required: [kind, field_id]
      properties:
        kind: { type: string, const: field }
        field_id: { type: string }
        var: { type: string, description: Defaults to Field.default_var }
        index: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: Extra-dimension indices (default 0) }
        volume: { type: boolean, default: false, description: Select all layers when the third-to-last dimension is vertical. Otherwise use the selected plane. }
        replicate_z: { type: integer, minimum: 1, default: 1, description: Number of layers to initialize from a selected plane (including a drawing). Applies to planes only. }
        fill_value:
          type: [number, "null"]
          description: Replaces missing cells. Required (422 otherwise) when the selected plane or volume has missing cells.

    PresetSource:
      type: object
      additionalProperties: false
      required: [kind, preset, nx, ny]
      properties:
        kind: { type: string, const: preset }
        preset: { $ref: "#/components/schemas/Preset" }
        nx: { type: integer, minimum: 4 }
        ny: { type: integer, minimum: 4 }
        nz: { type: integer, minimum: 1, default: 1 }

    RunSource:
      oneOf:
        - { $ref: "#/components/schemas/FieldSource" }
        - { $ref: "#/components/schemas/PresetSource" }
      discriminator:
        propertyName: kind
        mapping:
          field: "#/components/schemas/FieldSource"
          preset: "#/components/schemas/PresetSource"

    BoundaryConfig:
      type: object
      additionalProperties: false
      properties:
        left: { $ref: "#/components/schemas/BoundaryCondition" }
        right: { $ref: "#/components/schemas/BoundaryCondition" }
        bottom: { $ref: "#/components/schemas/BoundaryCondition" }
        top: { $ref: "#/components/schemas/BoundaryCondition" }
        front: { $ref: "#/components/schemas/BoundaryCondition" }
        back: { $ref: "#/components/schemas/BoundaryCondition" }
      description: Each edge defaults to dirichlet.

    RunRequest:
      type: object
      additionalProperties: false
      required: [source, dt, steps]
      properties:
        source: { $ref: "#/components/schemas/RunSource" }
        dx: { type: number, exclusiveMinimum: 0, default: 1.0 }
        dy: { type: number, exclusiveMinimum: 0, default: 1.0 }
        dz: { type: number, exclusiveMinimum: 0, default: 1.0 }
        Dz: { type: number, minimum: 0, description: Vertical diffusion coefficient. Defaults to D. }
        vz: { type: number, default: 0.0 }
        D: { type: number, minimum: 0, default: 0.0, description: Diffusion coefficient }
        vx: { type: number, default: 0.0 }
        vy: { type: number, default: 0.0 }
        dt: { type: number, exclusiveMinimum: 0 }
        steps: { type: integer, minimum: 1, maximum: 2147483647 }
        out_every: { type: integer, minimum: 1, description: "Mutually exclusive with frames" }
        frames: { type: integer, minimum: 2, description: "Frames to keep (incl. initial and final). Default 101 when neither is given." }
        bc: { $ref: "#/components/schemas/BoundaryConfig" }
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name. Omitted → derived by the server (preset label or field name, plus the creation time).
        units: { $ref: "#/components/schemas/Units" }
        processes:
          type: integer
          minimum: 1
          description: >
            MPI ranks. Clients should omit it (the web app does). Omitted → chosen by the server from the grid size and
            cpu_count (enough cells per rank to be worth it), then reduced so the MPI_Dims_create grid fits nx and ny.
            For volumes, all ranks must fit a Cartesian factorization across nx, ny and nz.
            An explicit value that does not fit, or exceeds cpu_count, is rejected.

    ResolvedRun:
      type: object
      additionalProperties: false
      required: [nx, ny, nz, dz, dt, steps, out_every, expected_frames, processes, dt_max, estimated_output_bytes]
      properties:
        nx: { type: integer }
        ny: { type: integer }
        nz: { type: integer, minimum: 1 }
        dz: { type: number, exclusiveMinimum: 0 }
        dt: { type: number }
        steps: { type: integer }
        out_every: { type: integer }
        expected_frames: { type: integer }
        processes: { type: integer }
        dt_max: { type: [number, "null"] }
        estimated_output_bytes: { type: integer, description: "≈ 8·nx·ny·nz·expected_frames + header" }

    RunValidation:
      type: object
      additionalProperties: false
      required: [ok, errors, warnings, resolved]
      properties:
        ok: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/ValidationIssue" } }
        warnings:
          type: array
          items: { type: string }
          description: Non-blocking, e.g. estimated output larger than free disk space, very long expected run.
        resolved: { oneOf: [{ $ref: "#/components/schemas/ResolvedRun" }, { type: "null" }] }

    Run:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, request, resolved, step, time, frames, queue_position, display_range, message, expires_at, size_bytes]
      properties:
        id: { type: string }
        name: { type: string, description: Display name (request.name or the server-derived default; editable with PATCH) }
        size_bytes: { type: integer, description: Bytes on disk for this run now (frames, result.nc, exports); 0 once expired }
        status: { type: string, enum: [queued, running, done, error, expired] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: When outputs are deleted (done/error) or the record is deleted (expired) }
        request: { $ref: "#/components/schemas/RunRequest" }
        resolved: { $ref: "#/components/schemas/ResolvedRun" }
        queue_position: { type: [integer, "null"], description: 1 = next; null unless queued }
        step: { type: integer }
        time: { type: number }
        frames: { type: integer, description: "Frames 0..frames-1 are written and readable" }
        elapsed_seconds: { type: [number, "null"] }
        display_range:
          type: [array, "null"]
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: >
            Fixed default colour range for the whole run, from frame 0 (widened to include 0 when any edge is dirichlet).
            Advection–diffusion with these schemes cannot leave this range, so colours never shift during playback.
            A constant field renders as the colormap midpoint. Slices and projections of a nonuniform volume
            use the run range even when every pixel in the view has the same value.
        message: { type: [string, "null"], description: Error text when status is error }

    NowcastParams:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        radius_km: { type: number, minimum: 50, maximum: 1000, default: 300, description: Half the width of the square domain. }
        hours: { type: integer, minimum: 1, maximum: 12, default: 6, description: Horizon for window=now; ignored for tonight. }
        window:
          type: string
          enum: [now, tonight]
          default: now
          description: >
            now: the next `hours` hours. tonight: from data_time until the end of the coming (or current) astronomical
            night (Sun below −18°), at most 24 h ahead. 422 when the site has no astronomical darkness in the next 24 h.
        resolution: { type: integer, minimum: 16, maximum: 256, default: 96, description: Simulation cells per side. }
        blend_tau_hours:
          type: number
          exclusiveMinimum: 0
          default: 2
          description: E-folding time in hours for the transport weight in the blend.

    CloudFraction:
      type: number
      minimum: 0
      maximum: 1

    SkyCover:
      type: object
      additionalProperties: false
      required: [low, mid, high, total, clear]
      properties:
        low: { $ref: "#/components/schemas/CloudFraction" }
        mid: { $ref: "#/components/schemas/CloudFraction" }
        high: { $ref: "#/components/schemas/CloudFraction" }
        total: { $ref: "#/components/schemas/CloudFraction" }
        clear: { $ref: "#/components/schemas/CloudFraction", description: One minus total cloud fraction. }

    Nowcast:
      type: object
      additionalProperties: false
      required: [id, status, created_at, params, data_time, layers, site, best_window, grid, night, message, expires_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [fetching, queued, running, done, error] }
        created_at: { type: string, format: date-time }
        params: { $ref: "#/components/schemas/NowcastParams" }
        data_time: { type: [string, "null"], format: date-time, description: UTC valid hour of initial cloud cover. Open-Meteo best match can combine model cycles. }
        layers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [layer, run_id, pressure_hpa]
            properties:
              layer: { type: string, enum: [low, mid, high] }
              run_id: { type: string }
              pressure_hpa: { type: integer, enum: [850, 500, 300] }
        site:
          type: [array, "null"]
          description: Null until done. Includes the initial hour and the final frame at ten-minute spacing.
          items:
            type: object
            additionalProperties: false
            required: [time, nowcast, model, blend, jet_ms, seeing]
            properties:
              time: { type: string, format: date-time }
              nowcast: { $ref: "#/components/schemas/SkyCover", description: "Bilinear site samples. Total uses random overlap across layers." }
              model: { $ref: "#/components/schemas/SkyCover", description: "Open-Meteo site layers and its own total, linearly interpolated between UTC hours." }
              blend:
                $ref: "#/components/schemas/SkyCover"
                description: Exponentially weighted transport and model values for each layer and for total. Clear is one minus blended total.
              jet_ms: { type: number, minimum: 0, description: Hourly 250 hPa wind speed in m/s held until the next hour. }
              seeing: { type: string, enum: [good, fair, poor], description: "Rule of thumb from jet_ms only. Good below 20, fair from 20 through 35, poor above 35." }
        best_window:
          type: [object, "null"]
          additionalProperties: false
          description: >
            Longest stretch of consecutive ten-minute samples with blended clear fraction at least 0.70 and good
            or fair seeing. When `night` is present only samples between dusk and dawn qualify (1.4.0).
            Ties go to the earliest stretch. Null until done or when no sample qualifies.
          required: [start, end, mean_clear, seeing]
          properties:
            start: { type: string, format: date-time, description: Time of the first qualifying sample. }
            end: { type: string, format: date-time, description: Time of the last qualifying sample (inclusive). }
            mean_clear: { $ref: "#/components/schemas/CloudFraction", description: Mean blended clear fraction across the stretch. }
            seeing: { type: string, enum: [good, fair], description: Worst seeing category across the stretch. }
        grid:
          type: object
          additionalProperties: false
          description: Local cell-centred equirectangular grid. The site is at fractional indices ((nx−1)/2, (ny−1)/2).
          required: [nx, ny, dx_m, dy_m, lat0, lon0]
          properties:
            nx: { type: integer }
            ny: { type: integer }
            dx_m: { type: number, description: Eastward cell spacing in metres. }
            dy_m: { type: number, description: Northward cell spacing in metres. }
            lat0: { type: number, description: Latitude of the southwest cell centre in degrees. }
            lon0: { type: number, description: Longitude of the southwest cell centre in degrees. }
        night:
          type: [object, "null"]
          additionalProperties: false
          description: >
            Darkness and Moon for the night covered by the record (null when the site has no astronomical night in the
            horizon). Times are UTC. Accuracy target: Sun events within 2 minutes, Moon altitude within 1°.
          required: [dusk, dawn, moon]
          properties:
            dusk: { type: string, format: date-time, description: End of astronomical twilight (Sun at −18°, setting); may precede data_time. }
            dawn: { type: string, format: date-time, description: Start of astronomical twilight (Sun at −18°, rising). }
            moon:
              type: array
              description: Every 10 minutes from max(dusk, data_time) to dawn.
              items:
                type: object
                additionalProperties: false
                required: [time, altitude_deg, illumination]
                properties:
                  time: { type: string, format: date-time }
                  altitude_deg: { type: number, description: Topocentric altitude of the Moon's centre, without refraction }
                  illumination: { type: number, minimum: 0, maximum: 1, description: Illuminated fraction of the disc }
        message: { type: [string, "null"] }
        expires_at: { type: string, format: date-time, description: Seven days from completion for a terminal record. }
