services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DISK_SAFETY_MARGIN_BYTES: ${DISK_SAFETY_MARGIN_BYTES:-2147483648}
      ENGINE_MEMORY_RESERVE_BYTES: ${ENGINE_MEMORY_RESERVE_BYTES:-536870912}
      ENGINE_MEMORY_BYTES: ${ENGINE_MEMORY_BYTES:-}
      ENGINE_PERIODIC: ${ENGINE_PERIODIC:-1}
      MPIRUN_ARGS: ${MPIRUN_ARGS:---oversubscribe}
    volumes:
      - simulations:/data
    init: true

volumes:
  simulations:
