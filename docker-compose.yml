services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENGINE_PERIODIC: ${ENGINE_PERIODIC:-0}
      MPIRUN_ARGS: ${MPIRUN_ARGS:---oversubscribe}
    volumes:
      - simulations:/data
    init: true

volumes:
  simulations:
